{% extends "base.html" %}

{% block title %}Register - ConcertHub{% endblock %}

{% block content %}

    <section class="auth-container">
        <div class="auth-box">
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Join ConcertHub to start booking tickets.</p>

            <form class="auth-form" action="{{ url_for('register') }}" method="POST">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </section>

{% endblock %}
