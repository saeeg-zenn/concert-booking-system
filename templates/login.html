{% extends "base.html" %}

{% block title %}Login - ConcertHub{% endblock %}

{% block nav_login %}active{% endblock %}

{% block content %}

    <section class="auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to book your next concert.</p>

            <form class="auth-form" action="{{ url_for('login') }}" method="POST">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary btn-full">Login</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </section>

{% endblock %}
